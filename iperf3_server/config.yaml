name: "iperf3"
version: "2.2.3"
slug: "iperf3_server"
description: "Runs iperf3 as both server (RX) and client (TX), with entities via MQTT and a web UI"
url: "https://github.com/esnet/iperf"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:speedometer
panel_title: "iperf3"
ports:
  5201/tcp: 5201
ports_description:
  5201/tcp: "iperf3 server port"
options:
  port: 5201
  verbose_logging: false
schema:
  port: "port"
  verbose_logging: "bool"
services:
  - mqtt:want
