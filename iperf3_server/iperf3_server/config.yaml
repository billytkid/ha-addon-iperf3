name: "iperf3 Server"
version: "1.3.0"
slug: "iperf3_server"
description: "Runs an iperf3 server and publishes client IP + throughput as HA entities via MQTT"
url: "https://github.com/esnet/iperf"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
startup: services
boot: auto
ports:
  5201/tcp: 5201
ports_description:
  5201/tcp: "iperf3 server port"
options:
  port: 5201
schema:
  port: "port"
services:
  - mqtt:want
